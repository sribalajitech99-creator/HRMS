# Render Blueprint for the Django HRMS backend
# Documentation: https://render.com/docs/blueprint-spec
#
# NOTE: Application secrets (SECRET_KEY, DB_PASSWORD, etc.) must be set in the
# Render dashboard under Environment -> Environment Variables. They are NOT
# stored here. Only placeholders/names are referenced below via envVars with
# sync: false so Render does NOT generate values and REQUIRES you to set them.
#
# The project module is "config", so the WSGI application is config.wsgi:application.

services:
  - type: web
    name: srinivasa-employee-portal-backend
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 2
      --timeout 120
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_SSL_MODE
        value: "DISABLED"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "true"
